        - heading "ChaosZeroNightmareDeckBuilder" [level=1] [ref=f4e48]
        - paragraph [ref=f4e49]: カオスゼロナイトメア向けのデッキ構築支援ツール。
        - heading "ChaosZeroNightmareDeckBuilder" [level=1] [ref=f4e50]
        - list [ref=f4e51]:
          - listitem [ref=f4e52]:
            - text: "GitHub:"
            - link "https://github.com/Drakontia/ChaosZeroNightmareDeckBuilder" [ref=f4e53] [cursor=pointer]:
              - /url: https://github.com/Drakontia/ChaosZeroNightmareDeckBuilder
        - heading [level=2] [ref=f4e54]:
          - link "概要#" [ref=f4e55] [cursor=pointer]:
            - /url: "#概要"
        - paragraph [ref=f4e56]: デッキビルダーは、カオゼロのデッキ（ゲーム内で言うところのセーブデータとして表示されるもの）を自由に構築できるサイトです。 使いやすい様に、なるべくゲーム内に近いような見た目、操作性にしてあります。 スマホでも一応使えますが、見た目の調整がまだの部分があり見にくいこともありますが、ご容赦ください。 （デッキエディターになっていますが、デッキビルダーの方が正しいかと思い、いずれ改名する予定です。）
        - paragraph [ref=f4e57]: 使用用途としては、カオスに潜る前にあらかじめデッキを考えておいて備忘録にしたり、こういうデッキが出来ましたというのを共有したりなどにご利用して頂ければと思います。 キャラ解説などの配信にも使って問題ありませんので、どうぞたくさんご利用ください。
        - heading [level=2] [ref=f4e58]:
          - link "使い方#" [ref=f4e59] [cursor=pointer]:
            - /url: "#使い方"
        - heading [level=3] [ref=f4e60]:
          - link "①トップページ#" [ref=f4e61] [cursor=pointer]:
            - /url: "#トップページ"
        - paragraph [ref=f4e62]:
          - link "外部リンク" [ref=f4e63] [cursor=pointer]:
            - /url: https://czn-deck-editor.drakontia.com/
          - text: からサイトにアクセスする。 以降の作業では、PC・スマートフォンのどちらでもプライベートモードを使用しないこと。 プライベートモードでは設定が保存されない。
        - heading [level=3] [ref=f4e64]:
          - link "②キャラクター選択#" [ref=f4e65] [cursor=pointer]:
            - /url: "#キャラクター選択"
        - paragraph [ref=f4e66]: まずは左側にある「キャラクターを選択」をクリックする。
        - paragraph [ref=f4e67]: 使用するキャラクターを選び、クリックする。
        - heading [level=3] [ref=f4e68]:
          - link "③装備選択#" [ref=f4e69] [cursor=pointer]:
            - /url: "#装備選択"
        - paragraph [ref=f4e70]: 獲得装備のところにある武器、防具、アクセサリのアイコンをクリックする。
        - paragraph [ref=f4e71]: 使用する装備を選び、クリックする。 右上の！マークをクリックすると、装備のレアリティ、効果が表示される。
        - heading [level=3] [ref=f4e72]:
          - link "④カード選択#" [ref=f4e73] [cursor=pointer]:
            - /url: "#カード選択"
        - paragraph [ref=f4e74]: 画面下の「カードを追加」のところで、追加したいカードを選び、クリックする。 共用カード、モンスターカード、禁忌カードは最初折り畳まれているので、必要の際には文字のところをクリックして広げる。 もしくは、右上の「カード検索」で追加したいカードの名前を入力する。
        - heading [level=3] [ref=f4e75]:
          - link "⑤ヒラメキ選択#" [ref=f4e76] [cursor=pointer]:
            - /url: "#ヒラメキ選択"
        - paragraph [ref=f4e77]: カードにヒラメキを適用したい時は、電球マークをクリックする。
        - paragraph [ref=f4e78]: ヒラメキの効果が適用されたカードが表示されるので、変更したい効果のカードをクリックする。 隠しヒラメキも最初は折り畳まれているので、必要に応じて広げてから選択する。 適用したヒラメキをなくしてサラの状態にするには、右上の「除去」をクリックする。
        - heading [level=3] [ref=f4e79]:
          - link "⑥神ヒラメキ#" [ref=f4e80] [cursor=pointer]:
            - /url: "#神ヒラメキ"
        - paragraph [ref=f4e81]: カードに神ヒラメキを適用したい時は、雷みたいなマークをクリックする。
        - paragraph [ref=f4e82]: 最初にどの神にしたいかを選び、該当の神をクリックする。 （実を言うと、どれもほぼ一緒ではある。常に弱点攻撃と挟み撃ちだけは特定の神のみにある。）
        - paragraph [ref=f4e83]: ヒラメキと同じように、適用した効果のカードをクリックする。 なくしたい時は、右上の「除去」をクリックする。
        - heading [level=3] [ref=f4e84]:
          - link "⑦カードメニュー#" [ref=f4e85] [cursor=pointer]:
            - /url: "#カードメニュー"
        - paragraph [ref=f4e86]: カードの削除、コピー、変換、戻しを行いたい時は、カードの右の「三本線」をクリックする。 上から、削除、コピー、変換、戻しである。 基本カードと唯一が付いているカードには、変換ボタンは表示されない。
        - paragraph [ref=f4e87]: 削除したカードと変換元のカードは、下に表示される。 もし、削除、変換を戻す時は、このカードをクリックする。
        - paragraph [ref=f4e88]: 変換をクリックすると、変換先のカードを選択する画面が表示される。 変換先にしたいカードを選び、クリックする。
        - paragraph [ref=f4e89]: 戻しは、「追加、削除、コピー、変換」をなかったことにする。 戻しを適切に行わないと、曖昧な記憶の計算はずれるので、注意すること。
        - heading [level=3] [ref=f4e90]:
          - link "⑧デッキメニュー#" [ref=f4e91] [cursor=pointer]:
            - /url: "#デッキメニュー"
        - paragraph [ref=f4e92]: 作成したデッキには、デッキ名を入力できる。これは、後続の処理の際に使用される。
        - list [ref=f4e93]:
          - listitem [ref=f4e94]: 保存：作成したデッキを各端末上に保存する。
          - listitem [ref=f4e95]: 読込：保存したデッキをリストで表示して、デッキ上に再度表示する。
          - listitem [ref=f4e96]: 共有：作成したデッキの情報をURLに変換する。Xなどで共有する際などに。
          - listitem [ref=f4e97]: エクスポート：作成したデッキを、画像に変換する。
          - listitem [ref=f4e98]: クリア：作成したデッキをクリアして、キャラクター選択から始める状態にする。
        - heading [level=2] [ref=f4e99]:
          - link "注意点#" [ref=f4e100] [cursor=pointer]:
            - /url: "#注意点"
        - list [ref=f4e101]:
          - listitem [ref=f4e102]: いくつかのカードや装備の画像はまだ用意できていません。
          - listitem [ref=f4e103]: もし、記載されている内容に間違いがあったら、教えてください。
          - listitem [ref=f4e104]: もし曖昧な記憶の計算に間違いがあったら、教えてください。
          - listitem [ref=f4e105]: 変換先を排除されるカードにして、削除のポイントを省略するというのは、今のところ実現出来ていません。
          - listitem [ref=f4e106]: 隠しヒラメキと神ヒラメキは、本来であればカードごとに適用できる種類が決まっていますが、そこは考慮されていません。
          - listitem [ref=f4e107]: 潜在力が適応された状態のカード効果を出したいのですが、まだ実装できていません。
          - listitem [ref=f4e108]: エゴ発言も同じようなことをするつもりはあるのですが、まだ実装できていません。
          - listitem [ref=f4e109]: 使用することはないかもしれませんが、多言語対応はしてありますが、まだ翻訳が間に合っていません。
